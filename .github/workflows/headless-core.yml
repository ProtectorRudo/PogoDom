name: PogoDom Headless Certification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  certify-headless:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore battle tests
        run: dotnet restore headless/PogoDom.Core.Tests.csproj
      - name: Build battle tests
        run: dotnet build headless/PogoDom.Core.Tests.csproj --configuration Release --no-restore
      - name: Test battle core
        run: dotnet test headless/PogoDom.Core.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Restore meta tests
        run: dotnet restore headless/PogoDom.Meta.Tests.csproj
      - name: Build meta tests
        run: dotnet build headless/PogoDom.Meta.Tests.csproj --configuration Release --no-restore
      - name: Test city and nation meta
        run: dotnet test headless/PogoDom.Meta.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Restore session tests
        run: dotnet restore headless/PogoDom.Session.Tests.csproj
      - name: Build session tests
        run: dotnet build headless/PogoDom.Session.Tests.csproj --configuration Release --no-restore
      - name: Test zero-friction session loop
        run: dotnet test headless/PogoDom.Session.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Restore cosmetics tests
        run: dotnet restore headless/PogoDom.Cosmetics.Tests.csproj
      - name: Build cosmetics tests
        run: dotnet build headless/PogoDom.Cosmetics.Tests.csproj --configuration Release --no-restore
      - name: Test cosmetic competitive integrity
        run: dotnet test headless/PogoDom.Cosmetics.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Restore verification tests
        run: dotnet restore headless/PogoDom.Verification.Tests.csproj
      - name: Build verification tests
        run: dotnet build headless/PogoDom.Verification.Tests.csproj --configuration Release --no-restore
      - name: Test signed deterministic battle replay
        run: dotnet test headless/PogoDom.Verification.Tests.csproj --configuration Release --no-build --verbosity normal
      - name: Restore simulation lab
        run: dotnet restore headless/PogoDom.Sim.csproj
      - name: Run 250 headless matches
        run: dotnet run --project headless/PogoDom.Sim.csproj --configuration Release -- --matches 250 --seed 20260905 --assert
